# ============================================
# 3A Game Master - Nginx 反向代理配置
# 放置于 /www/server/panel/vhost/nginx/3agamemaster.com.conf
# 或 /etc/nginx/conf.d/3agamemaster.com.conf
# ============================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name 3agamemaster.com www.3agamemaster.com;
    return 301 https://3agamemaster.com$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name 3agamemaster.com www.3agamemaster.com;

    # ─── SSL 证书 (宝塔面板会自动配置) ───
    # ssl_certificate     /www/server/panel/vhost/cert/3agamemaster.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/3agamemaster.com/privkey.pem;

    # ─── SSL 优化 ───
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── www → 非 www 重定向 ───
    if ($host = www.3agamemaster.com) {
        return 301 https://3agamemaster.com$request_uri;
    }

    # ─── 日志 ───
    access_log /www/wwwlogs/3agamemaster.com.log;
    error_log  /www/wwwlogs/3agamemaster.com.error.log;

    # ─── 安全头 ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Next.js 静态资源 (长期缓存) ───
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── Next.js 图片优化 (如果启用) ───
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 7d;
    }

    # ─── 反向代理到 Next.js ───
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置 (AI生成可能较慢)
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 禁用缓存 (动态页面)
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ─── API 路由 (更长超时，AI生成可能耗时) ───
    location /api/generate/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成接口需要更长超时
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 禁用缓存
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ─── 健康检查 (不记日志) ───
    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── 静态文件 (public目录) ───
    location /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location /manifest.webmanifest {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # ─── Gzip 压缩 ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ─── 禁止访问隐藏文件 ───
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
